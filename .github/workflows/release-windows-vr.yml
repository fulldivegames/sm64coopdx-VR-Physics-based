name: Build Windows VR release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version label
        required: true
        default: dev
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-vr:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2
            python3

      - name: Build assetless Windows executable
        run: make -j$(nproc)

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create player ZIP
        shell: pwsh
        run: ./tools/package-vr-windows.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload player ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM64-Co-Op-DX-VR-Windows-${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --generate-notes --title "SM64 Co-Op DX VR ${{ github.ref_name }}"
